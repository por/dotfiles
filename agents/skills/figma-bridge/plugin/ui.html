<style>
  body { margin: 0; padding: 12px; font: 12px system-ui, sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); }
</style>
<p id="status">Connecting…</p>
<script>
  const RELAY = 'http://localhost:7865';
  const status = document.getElementById('status');

  // text/plain bodies keep the requests "simple", so the relay needs no CORS preflight.
  onmessage = (event) => {
    fetch(`${RELAY}/result`, { method: 'POST', body: JSON.stringify(event.data.pluginMessage) });
  };

  (async () => {
    for (;;) {
      try {
        const res = await fetch(`${RELAY}/next`);
        if (!res.ok) throw new Error(`Relay answered ${res.status}`);
        status.textContent = 'Connected to relay';
        if (res.status === 200) parent.postMessage({ pluginMessage: await res.json() }, '*');
      } catch {
        status.textContent = 'Waiting for relay on :7865';
        await new Promise((resolve) => setTimeout(resolve, 2000));
      }
    }
  })();
</script>
